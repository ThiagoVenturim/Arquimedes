[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arquimedes"
dynamic = ["version"]
description = "A small FunSearch-style laboratory: propose, test in a sandbox, measure, keep the best heuristic."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thiago Domingos Venturim Ribeiro dos Santos" }]
keywords = ["program-search", "heuristics", "funsearch", "bin-packing", "sandbox"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
arquimedes = "arquimedes.cli:main"

[tool.hatch.version]
path = "src/arquimedes/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/arquimedes"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
